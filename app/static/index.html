<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Домашки DSC</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff);
    --text: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #888);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #fff);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f5);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px 16px 40px; font: 15px/1.4 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  nav { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  nav button.active { background: var(--btn); color: var(--btn-text); }
  button { border: 0; border-radius: 8px; padding: 8px 12px; background: var(--card); color: var(--text); font: inherit; cursor: pointer; }
  button.primary { background: var(--btn); color: var(--btn-text); }
  button:disabled { opacity: .5; }
  .card { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .card h3 { margin: 0 0 6px; font-size: 16px; }
  .hint { color: var(--hint); font-size: 13px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
  .task { border-top: 1px solid rgba(127,127,127,.25); padding-top: 8px; margin-top: 8px; }
  .score { font-weight: 600; }
  input, textarea { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid rgba(127,127,127,.35); background: var(--bg); color: var(--text); font: inherit; }
  label { display: block; margin: 8px 0 4px; font-size: 13px; color: var(--hint); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { text-align: left; padding: 4px; border-bottom: 1px solid rgba(127,127,127,.2); vertical-align: top; }
  .err { color: #d33; }
  ul { margin: 4px 0; padding-left: 18px; }
  a { color: var(--link); }
</style>
</head>
<body>
<nav id="nav"></nav>
<div id="msg"></div>
<main id="view"><p class="hint">Загрузка…</p></main>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const initData = tg?.initData || "";
let ME = null;
const ICON = { correct: "✅", partial: "🟡", incorrect: "❌", not_done: "⬜" };
const STATUS = { queued: "⏳ в очереди", checking: "🔎 проверяется", done: "готово", error: "⚠️ ошибка" };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (iso) => iso ? new Date(iso).toLocaleString("ru-RU", { dateStyle: "short", timeStyle: "short" }) : "—";

async function api(path, opts = {}) {
  const res = await fetch("/api" + path, { ...opts, headers: { ...(opts.headers || {}), "X-Telegram-Init-Data": initData } });
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch {}
    throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
  }
  const ct = res.headers.get("content-type") || "";
  return ct.includes("application/json") ? res.json() : res.blob();
}

function flash(text, isErr = false) {
  $("#msg").innerHTML = text ? `<div class="card ${isErr ? "err" : ""}">${esc(text)}</div>` : "";
  if (text) setTimeout(() => { $("#msg").innerHTML = ""; }, 6000);
}

async function download(path, name) {
  try {
    const blob = await api(path);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
  } catch (e) { flash(e.message, true); }
}

// ---------- задания ----------
async function showAssignments() {
  const list = await api("/assignments");
  if (!list.length) { $("#view").innerHTML = `<p class="hint">Пока нет открытых заданий.</p>`; return; }
  $("#view").innerHTML = list.map((a) => `
    <div class="card">
      <h3>${esc(a.title)} ${a.is_active ? "" : '<span class="hint">(закрыто)</span>'}</h3>
      ${a.description ? `<div>${esc(a.description)}</div>` : ""}
      <div class="hint">Заданий: ${a.task_count} · Попытки: ${a.attempts_used}/${a.max_attempts}
        ${a.deadline ? ` · Дедлайн: ${fmt(a.deadline)}` : ""}
        ${a.best_score !== null ? ` · Лучший: <span class="score">${a.best_score}/${a.max_score}</span>` : ""}</div>
      <div class="row">
        ${ME.bot_enabled ? `<button onclick="sendTemplate(${a.id})">📥 Шаблон в чат</button>` : ""}
        <button onclick="download('/assignments/${a.id}/template', 'template.ipynb')">Скачать</button>
      </div>
      <div class="row">
        <input type="file" accept=".ipynb" id="file-${a.id}" style="flex:1">
        <button class="primary" onclick="submitWork(${a.id}, this)">📤 Сдать</button>
      </div>
    </div>`).join("");
}

async function sendTemplate(id) {
  try { await api(`/assignments/${id}/template/send`, { method: "POST" }); flash("Шаблон отправлен в чат с ботом"); }
  catch (e) { flash(e.message, true); }
}

async function submitWork(id, btn) {
  const input = $(`#file-${id}`);
  if (!input.files.length) { flash("Выбери .ipynb файл", true); return; }
  const fd = new FormData(); fd.append("file", input.files[0]);
  btn.disabled = true;
  try {
    const sub = await api(`/assignments/${id}/submissions`, { method: "POST", body: fd });
    flash("Работа принята, идёт проверка…");
    await pollSubmission(sub.id);
  } catch (e) { flash(e.message, true); }
  finally { btn.disabled = false; }
}

async function pollSubmission(id) {
  showSubmission(id);
  for (let i = 0; i < 120; i++) {
    await new Promise((r) => setTimeout(r, 5000));
    const s = await api(`/submissions/${id}`);
    if (s.status === "done" || s.status === "error") { showSubmission(id); return; }
  }
}

// ---------- сдачи ----------
async function showMine() {
  const subs = await api("/submissions");
  if (!subs.length) { $("#view").innerHTML = `<p class="hint">Сдач пока нет.</p>`; return; }
  $("#view").innerHTML = `<div class="card"><table>
    <tr><th>#</th><th>Задание</th><th>Когда</th><th>Итог</th></tr>
    ${subs.map((s) => `<tr><td><a href="#" onclick="showSubmission(${s.id});return false">${s.id}</a></td>
      <td>${esc(s.assignment_title)}</td><td>${fmt(s.created_at)}</td>
      <td>${s.status === "done" ? `<span class="score">${s.score}/${s.max_score}</span>` : STATUS[s.status]}</td></tr>`).join("")}
  </table></div>`;
}

async function showSubmission(id) {
  const s = await api(`/submissions/${id}`);
  let html = `<div class="card"><h3>${esc(s.assignment_title)} · сдача #${s.id}</h3>
    ${s.user ? `<div class="hint">${esc(s.user.name)} (id ${s.user.tg_id})</div>` : ""}
    <div class="hint">${fmt(s.created_at)} · ${STATUS[s.status]}</div>`;
  if (s.status === "done" && s.result) {
    const r = s.result;
    html += `<p class="score">Итог: ${r.score}/${r.max_score}</p><p>${esc(r.summary)}</p>`;
    for (const t of r.tasks) {
      html += `<div class="task"><b>${ICON[t.verdict] || ""} Задание ${t.number}. ${esc(t.title)}</b> — <span class="score">${t.score}/10</span>
        <div>${esc(t.feedback)}</div>
        ${t.improvements?.length ? `<ul>${t.improvements.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</div>`;
    }
    if (ME.is_admin && r.warnings?.length) html += `<p class="err">${esc(r.warnings.join("; "))}</p>`;
  } else if (s.status === "error") {
    html += `<p>Не получилось проверить автоматически, попытка не засчитана.</p>${s.error ? `<p class="err">${esc(s.error)}</p>` : ""}`;
  } else {
    html += `<p class="hint">Проверка обычно занимает 1–3 минуты. Отзыв также придёт в чат с ботом.</p>`;
  }
  if (ME.is_admin) {
    html += `<div class="row"><button onclick="recheck(${s.id})">Перепроверить</button>
      <button onclick="download('/admin/submissions/${s.id}/file', 'submission_${s.id}.ipynb')">Файл участника</button></div>`;
  }
  $("#view").innerHTML = html + "</div>";
}

// ---------- админка ----------
async function showAdmin() {
  const list = await api("/assignments");
  $("#view").innerHTML = `
    <div class="card"><h3>Новое задание</h3>
      <form id="new-form">
        <label>Название</label><input name="title" required>
        <label>Описание для участников</label><textarea name="description" rows="2"></textarea>
        <label>Лимит попыток</label><input name="max_attempts" type="number" min="1" placeholder="по умолчанию">
        <label>Дедлайн (необязательно)</label><input name="deadline" type="datetime-local">
        <label>Шаблон для участников (.ipynb)</label><input name="template" type="file" accept=".ipynb" required>
        <label>Эталонное решение (.ipynb)</label><input name="reference" type="file" accept=".ipynb" required>
        <div class="row"><button class="primary" type="submit">Создать</button></div>
      </form>
      <div id="new-result"></div>
    </div>
    ${list.map((a) => `<div class="card"><h3>#${a.id} ${esc(a.title)}</h3>
      <div class="hint">${a.is_active ? "открыто" : "закрыто"} · заданий: ${a.task_count} · попыток: ${a.max_attempts}
        ${a.deadline ? ` · дедлайн ${fmt(a.deadline)}` : ""}</div>
      <div class="row">
        <button onclick="adminSubs(${a.id})">Сдачи</button>
        <button onclick="download('/admin/assignments/${a.id}/export.csv', 'results_${a.id}.csv')">CSV</button>
        <button onclick="toggle(${a.id}, ${!a.is_active})">${a.is_active ? "Закрыть приём" : "Открыть приём"}</button>
      </div></div>`).join("")}`;
  $("#new-form").onsubmit = async (ev) => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    if (!fd.get("max_attempts")) fd.delete("max_attempts");
    const btn = ev.target.querySelector("button"); btn.disabled = true;
    try {
      const r = await api("/admin/assignments", { method: "POST", body: fd });
      $("#new-result").innerHTML = `<p>✅ Создано задание #${r.id}. Найдены задания:</p>
        <ol>${r.tasks.map((t) => `<li>${esc(t.title)}</li>`).join("")}</ol>
        ${r.warnings.length ? `<p class="err">${r.warnings.map(esc).join("<br>")}</p>` : ""}`;
      ev.target.reset();
    } catch (e) { $("#new-result").innerHTML = `<p class="err">${esc(e.message)}</p>`; }
    finally { btn.disabled = false; }
  };
}

async function toggle(id, active) {
  const fd = new FormData(); fd.append("is_active", active);
  try { await api(`/admin/assignments/${id}`, { method: "PATCH", body: fd }); showAdmin(); }
  catch (e) { flash(e.message, true); }
}

async function adminSubs(id) {
  const subs = await api(`/admin/assignments/${id}/submissions`);
  $("#view").innerHTML = `<div class="card"><h3>Сдачи по заданию #${id}</h3>
    <div class="row"><button onclick="showAdmin()">← Назад</button></div>
    ${subs.length ? `<table><tr><th>#</th><th>Участник</th><th>Когда</th><th>Итог</th></tr>
      ${subs.map((s) => `<tr><td><a href="#" onclick="showSubmission(${s.id});return false">${s.id}</a></td>
        <td>${esc(s.user?.name)}</td><td>${fmt(s.created_at)}</td>
        <td>${s.status === "done" ? `${s.score}/${s.max_score}` : STATUS[s.status]}</td></tr>`).join("")}</table>`
      : `<p class="hint">Сдач пока нет.</p>`}</div>`;
}

async function recheck(id) {
  try { await api(`/admin/submissions/${id}/recheck`, { method: "POST" }); flash("Отправлено на перепроверку"); pollSubmission(id); }
  catch (e) { flash(e.message, true); }
}

// ---------- навигация ----------
const TABS = [["assignments", "Задания", showAssignments], ["mine", "Мои сдачи", showMine]];
function renderNav(active) {
  const tabs = ME.is_admin ? [...TABS, ["admin", "Организаторам", showAdmin]] : TABS;
  $("#nav").innerHTML = tabs.map(([k, label]) => `<button class="${k === active ? "active" : ""}" data-tab="${k}">${label}</button>`).join("");
  $("#nav").querySelectorAll("button").forEach((b) => b.onclick = () => go(b.dataset.tab));
}
async function go(tab) {
  const all = ME.is_admin ? [...TABS, ["admin", "", showAdmin]] : TABS;
  renderNav(tab);
  try { await all.find((t) => t[0] === tab)[2](); } catch (e) { $("#view").innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

(async () => {
  try { ME = await api("/me"); go("assignments"); }
  catch (e) { $("#view").innerHTML = `<p class="err">${esc(e.message)}</p>`; }
})();
</script>
</body>
</html>
