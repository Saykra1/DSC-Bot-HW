<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0F10">
<title>Домашки DSC</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  // Тему ставим до отрисовки, чтобы не было вспышки светлого фона
  (function () {
    var p = "dark";
    try { p = localStorage.getItem("dsc-theme") || "dark"; } catch (e) {}
    var tg = window.Telegram && window.Telegram.WebApp;
    if (p === "tg") p = tg && tg.colorScheme === "light" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", p);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/static/app.css?v=__V__">
</head>
<body>
<div id="offline" class="offline" role="status">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 2l20 20M8.5 16.4a5 5 0 0 1 7 0M5 12.8a10 10 0 0 1 5.2-2.7M19 12.8a10 10 0 0 0-2-1.4M12 20h.01"/></svg>
  Нет связи. Показываем сохранённое.
</div>
<div id="app" class="app">
  <nav id="tabs" class="tabbar" aria-label="Разделы"></nav>
  <main id="view" class="view">
    <div class="stack" style="gap:16px">
      <span class="skel" style="width:180px;height:30px"></span>
      <span class="skel" style="height:6px"></span>
      <span class="skel" style="height:60px"></span><span class="skel" style="height:60px"></span><span class="skel" style="height:60px"></span>
    </div>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js?v=__V__"></script>
</body>
</html>
